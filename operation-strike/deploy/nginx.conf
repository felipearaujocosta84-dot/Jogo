# Alternativa ao Caddy: nginx com certificado do certbot (sudo certbot --nginx -d jogo.seudominio.com.br)
server {
    listen 80;
    server_name jogo.seudominio.com.br;
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name jogo.seudominio.com.br;
    ssl_certificate     /etc/letsencrypt/live/jogo.seudominio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jogo.seudominio.com.br/privkey.pem;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # WebSocket (WSS)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
