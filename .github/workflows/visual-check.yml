# Verificação visual automática do carro 3D (fotos publicadas na release "visual-check").
name: Verificação visual

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências
        run: npm install && npm install --no-save puppeteer-core@22
      - name: Montar página de teste
        run: npx vite build --config tests/visual/vite.config.js
      - name: Fotografar carros
        run: |
          npx vite preview --config tests/visual/vite.config.js --outDir visual-dist --port 4173 &
          sleep 4
          node tests/visual/run.mjs http://localhost:4173/
      - name: Publicar fotos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd visual-out && for f in *; do mv "$f" "${{ github.run_number }}-$f"; done; cd ..
          gh release view visual-check >/dev/null 2>&1 || gh release create visual-check --prerelease --title "Verificação visual" --notes "Fotos automáticas do carro 3D" --target "${{ github.sha }}"
          gh release upload visual-check visual-out/* --clobber
