<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05070b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="screen-orientation" content="landscape" />
  <title>EXTREME RACING</title>
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body>
  <canvas id="renderCanvas" touch-action="none"></canvas>
  <div id="ui-root"></div>

  <div id="loading" class="loading">
    <div class="loading-brand">EXTREME<span>RACING</span></div>
    <div class="loading-bar"><i id="loading-fill"></i></div>
    <div id="loading-text" class="loading-text">Iniciando…</div>
  </div>

  <div id="rotate-hint" class="rotate-hint">
    <div class="rotate-phone"></div>
    <p>Gire o celular para o modo horizontal</p>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
